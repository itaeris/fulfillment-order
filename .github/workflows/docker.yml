name: Docker CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FRONTEND_IMAGE: itaeris/fulfillment_frontend_app
  BACKEND_IMAGE: itaeris/fulfillment_backend_app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_API_URL=

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write backend env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          set -eu
          mkdir -p /opt/fulfillment/docker
          printf '%s\n' "$BACKEND_ENV" > /opt/fulfillment/backend.env
          chmod 600 /opt/fulfillment/backend.env

      - name: Run docker deploy
        run: |
          set -eu
          chmod +x docker/deploy.sh
          ENV_FILE=/opt/fulfillment/backend.env ./docker/deploy.sh
